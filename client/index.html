<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f47b4f">
    <title>Golden Spatula Set 18 Guide</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #1f2937;
            --muted: #667085;
            --paper: #fffaf1;
            --orange: #f47b4f;
            --orange-dark: #c95231;
            --yellow: #ffd166;
            --mint: #9ee6c2;
            --blue: #8ed5e8;
            --line: #eadfce;
            --shadow: 0 16px 0 rgba(47, 43, 36, .07);
        }

        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            margin: 0;
            color: var(--ink);
            background: var(--paper);
            font-family: "Noto Sans Thai", sans-serif;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: .35;
            background-image: radial-gradient(#e8d5bd 1px, transparent 1px);
            background-size: 20px 20px;
            mask-image: linear-gradient(to bottom, black, transparent 80%);
        }
        a { color: inherit; text-decoration: none; }
        button { font: inherit; cursor: pointer; }
        .wrap { width: min(1120px, calc(100% - 40px)); margin: auto; position: relative; }
        .topbar { padding: 22px 0; display: flex; justify-content: space-between; align-items: center; }
        .brand { display: flex; gap: 11px; align-items: center; font-family: Kanit, sans-serif; font-size: 1.35rem; font-weight: 600; }
        .brand-mark { width: 40px; height: 40px; border: 2px solid var(--ink); border-radius: 12px 12px 12px 4px; background: var(--yellow); display: grid; place-items: center; transform: rotate(-7deg); }
        .brand-mark::after { content: "</>"; font-family: monospace; font-size: .83rem; transform: rotate(7deg); }
        nav { display: flex; gap: 28px; font-size: .9rem; color: var(--muted); font-weight: 600; }
        nav a:hover { color: var(--orange-dark); }
        .hero { padding: 52px 0 76px; display: grid; grid-template-columns: 1.1fr .9fr; gap: 70px; align-items: center; }
        .eyebrow { display: inline-flex; align-items: center; gap: 8px; color: var(--orange-dark); font-size: .8rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
        .eyebrow::before { content: ""; width: 28px; height: 3px; background: var(--orange); border-radius: 4px; }
        h1, h2, h3 { font-family: Kanit, sans-serif; margin: 0; line-height: 1.1; }
        h1 { max-width: 650px; margin-top: 17px; font-size: clamp(2.8rem, 6vw, 5.5rem); letter-spacing: -.03em; }
        h1 span { color: var(--orange); }
        .hero-copy { max-width: 510px; margin: 22px 0 30px; font-size: 1.04rem; line-height: 1.85; color: var(--muted); }
        .cta { display: inline-flex; align-items: center; gap: 10px; border: 2px solid var(--ink); border-radius: 9px; padding: 13px 18px; background: var(--orange); color: white; font-weight: 700; box-shadow: 4px 4px 0 var(--ink); transition: transform .2s, box-shadow .2s; }
        .cta:hover { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ink); }
        .illustration { min-height: 360px; position: relative; display: grid; place-items: center; }
        .blob { width: 315px; height: 315px; background: var(--mint); border: 2px solid var(--ink); border-radius: 46% 54% 61% 39% / 42% 45% 55% 58%; transform: rotate(10deg); }
        .notebook { position: absolute; width: 235px; background: white; border: 2px solid var(--ink); border-radius: 8px; padding: 23px; box-shadow: 11px 11px 0 var(--ink); transform: rotate(-7deg); }
        .notebook .holes { display: flex; justify-content: space-between; margin-bottom: 16px; color: var(--orange); font-size: 1.4rem; letter-spacing: 15px; }
        .notebook h3 { font-size: 1.45rem; margin-bottom: 16px; }
        .code-line { height: 8px; border-radius: 5px; background: #d9e8df; margin: 10px 0; }
        .code-line.short { width: 58%; background: #ffdca9; }
        .code-line.tiny { width: 75%; background: #b5dff0; }
        .sticker { position: absolute; right: 5%; top: 13%; background: var(--yellow); border: 2px solid var(--ink); padding: 13px 12px; font-family: Kanit; font-size: .95rem; transform: rotate(12deg); box-shadow: 4px 4px 0 var(--ink); }
        .section { padding: 40px 0 95px; }
        .section-heading { display: flex; justify-content: space-between; align-items: end; margin-bottom: 25px; gap: 20px; }
        .section-heading h2 { font-size: clamp(2rem, 4vw, 3.1rem); }
        .section-heading p { color: var(--muted); margin: 0; max-width: 390px; line-height: 1.65; }
        .lesson-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
        .lesson { border: 2px solid var(--ink); border-radius: 10px; padding: 22px; min-height: 220px; box-shadow: var(--shadow); transition: transform .2s; }
        .lesson:hover { transform: translateY(-5px) rotate(-.5deg); }
        .lesson:nth-child(1) { background: var(--yellow); }
        .lesson:nth-child(2) { background: var(--blue); }
        .lesson:nth-child(3) { background: var(--mint); }
        .lesson-number { font: 600 2.3rem Kanit; opacity: .42; }
        .lesson h3 { font-size: 1.5rem; margin: 17px 0 8px; }
        .lesson p { margin: 0; line-height: 1.65; font-size: .93rem; }
        .progress-wrap { margin-top: 38px; padding: 18px 20px; background: #fff; border: 2px solid var(--line); border-radius: 10px; display: flex; align-items: center; gap: 18px; }
        .progress-label { font-weight: 700; white-space: nowrap; font-size: .9rem; }
        .progress-bar { height: 10px; background: #f0e6d9; border-radius: 10px; flex: 1; overflow: hidden; }
        .progress-fill { height: 100%; width: 33%; background: var(--orange); border-radius: inherit; transition: width .4s ease; }
        .progress-value { color: var(--orange-dark); font-weight: 700; }
        .practice { display: grid; grid-template-columns: .85fr 1.15fr; gap: 22px; align-items: stretch; }
        .flashcard, .quiz { background: #fff; border: 2px solid var(--ink); border-radius: 10px; box-shadow: var(--shadow); }
        .flashcard { min-height: 300px; padding: 28px; display: flex; flex-direction: column; justify-content: space-between; background: #fffdf8; }
        .card-tag { font-size: .78rem; font-weight: 700; color: var(--orange-dark); letter-spacing: .08em; }
        .flashcard h3 { font-size: 2rem; margin: 22px 0 10px; }
        .flashcard p { color: var(--muted); line-height: 1.7; margin: 0; }
        .outline-btn { border: 2px solid var(--ink); border-radius: 7px; padding: 10px 14px; background: transparent; color: var(--ink); font-weight: 700; width: fit-content; }
        .outline-btn:hover { background: var(--yellow); }
        .quiz { padding: 28px; }
        .quiz h3 { font-size: 1.55rem; margin: 12px 0 22px; }
        .question { font-weight: 600; margin-bottom: 13px; }
        .answers { display: grid; gap: 9px; }
        .answer { text-align: left; border: 1px solid var(--line); border-radius: 6px; background: #fffaf4; padding: 11px 13px; color: var(--ink); }
        .answer:hover { border-color: var(--orange); background: #fff2df; }
        .answer.correct { border: 2px solid #2d9b69; background: #e2f7eb; }
        .answer.wrong { border: 2px solid #d75e4e; background: #ffebe7; }
        .feedback { min-height: 26px; margin: 14px 0 0; color: var(--orange-dark); font-weight: 700; font-size: .9rem; }
        footer { border-top: 2px solid var(--line); padding: 24px 0 36px; color: var(--muted); font-size: .85rem; }
        @media (max-width: 760px) {
            .wrap { width: min(100% - 28px, 600px); }
            nav { display: none; }
            .hero { grid-template-columns: 1fr; gap: 20px; padding-top: 35px; }
            .illustration { min-height: 310px; }
            .blob { width: 260px; height: 260px; }
            .sticker { right: 3%; }
            .lesson-grid, .practice { grid-template-columns: 1fr; }
            .section-heading { display: block; }
            .section-heading p { margin-top: 12px; }
            .progress-wrap { flex-wrap: wrap; gap: 10px; }
            .progress-bar { min-width: 100%; order: 3; }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
